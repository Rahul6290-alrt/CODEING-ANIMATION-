<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bao and the Last Green Shoot</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap">
<style>
:root{--bg:#f1efe6;--ink:#23332a;--accent:#3f7d4e;--panel:#e2dfd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--ink:#e8efe4;--accent:#7fc48d;--panel:#22332a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14201a;--ink:#e8efe4;--accent:#7fc48d;--panel:#22332a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fredoka",system-ui,sans-serif;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:880px}
#wrap{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:16/9;background:#222}
svg{display:block;width:100%;height:100%}
#stage{--s1:#ffd9a8;--s2:#f6efe0;--m1:#b9c6b0;--m2:#8fa88a;--g:#6f9a5c;--bam:#5f9e5a;--bs:1;--px:400px;--py:384px;--ps:1;--mx:0px;--sy:0px;--rain:0;--ff:0;--rp:0}
#stage[data-s="1"]{--s1:#e6dcc3;--s2:#cfc7b0;--m1:#b5b4a0;--m2:#9a9a80;--g:#a09a6a;--bam:#c9b56a;--bs:.72;--px:300px;--sy:20px}
#stage[data-s="2"]{--s1:#b9d8e8;--s2:#f2efe4;--m1:#a9c3d0;--m2:#7ea0a8;--g:#7fae66;--bam:#7fae66;--bs:.9;--px:680px;--mx:-180px;--sy:-30px}
#stage[data-s="3"]{--s1:#f6b98a;--s2:#f5e0c3;--m1:#d3b6a4;--m2:#a98d86;--g:#8aa55f;--bam:#7fae66;--px:330px;--rp:1;--mx:-300px;--sy:10px}
#stage[data-s="4"]{--s1:#1d3548;--s2:#3b6070;--m1:#355466;--m2:#2a4455;--g:#3c6b4a;--bam:#4f9a5a;--bs:1.15;--px:400px;--rain:1;--ff:1;--rp:1;--mx:-300px;--sy:200px}
.sk1{stop-color:var(--s1);transition:stop-color 2s}.sk2{stop-color:var(--s2);transition:stop-color 2s}
.m1{fill:var(--m1)}.m2{fill:var(--m2)}.gr{fill:var(--g)}
.m1,.m2,.gr{transition:fill 2s}
.par1{transform:translateX(calc(var(--mx)*.4));transition:transform 6s ease-in-out}
.par2{transform:translateX(var(--mx));transition:transform 6s ease-in-out}
#sun{transform:translateY(var(--sy));transition:transform 3s ease-in-out}
.st{transform:scaleY(var(--bs));transition:transform 2.5s ease-out}
.st rect{fill:var(--bam);transition:fill 2.5s}
.st .nd{fill:#0003}
#panda{transform:translate(var(--px),var(--py)) scale(var(--ps));transition:transform 6s ease-in-out}
#stage[data-s="3"] #panda{transition-duration:2.5s}
.bob{transform-origin:0 0}
#stage[data-s="2"] .bob{animation:bob .55s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-7px) rotate(2deg)}}
#stage[data-s="0"] .bob,#stage[data-s="4"] .bob{animation:breathe 3s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.025,1.04)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
#rp{opacity:var(--rp);transition:opacity 1.5s}
#stage[data-s="3"] #rp .rb{animation:shiver .12s linear infinite}
@keyframes shiver{50%{transform:translateX(1.5px)}}
#shoot{opacity:0;transition:opacity 1s}#stage[data-s="3"] #shoot{opacity:1}
#rain{opacity:var(--rain);transition:opacity 2s}
#rain line{stroke:#cfe6f2;stroke-width:1.5;stroke-linecap:round;animation:fall .7s linear infinite}
@keyframes fall{from{transform:translateY(-60px)}to{transform:translateY(480px)}}
#ff{opacity:var(--ff);transition:opacity 2s}
#ff circle{fill:#ffe98a;animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{opacity:.25;transform:translateY(-12px)}}
#cap{position:absolute;left:0;right:0;bottom:0;padding:34px 20px 16px;text-align:center;color:#fff;font-size:clamp(16px,3.2vw,26px);font-weight:600;line-height:1.3;background:linear-gradient(transparent,#0009);text-shadow:0 1px 4px #0008;opacity:0}
#cap.on{animation:cap 6.5s forwards}
@keyframes cap{0%{opacity:0;transform:translateY(8px)}12%,88%{opacity:1;transform:none}100%{opacity:.85}}
#intro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#14201acc;color:#fff;text-align:center;padding:20px;transition:opacity .6s}
#intro.hide{opacity:0;pointer-events:none}
#intro h1{margin:0;font-size:clamp(24px,5.5vw,46px);font-weight:600;line-height:1.1}
#intro p{margin:0;font-size:clamp(14px,2.4vw,18px);opacity:.85}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 20px;background:var(--accent);color:#fff;font-weight:600}
#bar{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
#bar .sec{background:var(--panel);color:var(--ink)}
#segs{display:flex;gap:6px;flex:1;min-width:180px}
#segs button{flex:1;height:10px;padding:0;border-radius:5px;background:var(--panel);position:relative;overflow:hidden}
#segs i{position:absolute;inset:0;width:0;background:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bob,.eye,#rain line,#ff circle{animation:none!important}}
</style>
</head>
<body>
<main>
<div id="wrap">
<svg id="stage" data-s="0" viewBox="0 0 800 450" aria-label="Animated story of a panda named Bao" role="img">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop class="sk1" offset="0"/><stop class="sk2" offset="1"/></linearGradient>
</defs>
<rect width="800" height="450" fill="url(#sky)"/>
<circle id="sun" cx="620" cy="110" r="42" fill="#fff6d8" opacity=".9"/>
<g class="par1"><path class="m1" d="M-400 330 L-250 170 L-120 300 L40 150 L220 320 L380 190 L540 310 L720 160 L900 320 L1060 200 L1200 330Z"/></g>
<g class="par2"><path class="m2" d="M-400 360 L-200 250 L-40 340 L150 240 L330 350 L520 260 L700 350 L880 250 L1100 360Z"/></g>
<rect class="gr" y="372" width="800" height="80"/>
<g id="bam"></g>
<path id="shoot" d="M470 384 q-2-30 4-48 q6 18 3 48z M474 360 q-18-10-24-26 q20 2 24 26z" fill="#6fc06a"/>
<g id="rp" transform="translate(560 384)"><g class="rb">
<path d="M26-20 q50-10 44-50 q-14 20-48 14z" fill="#b8462a"/><path d="M52-36 l12-9 M60-52 l10-7" stroke="#f4d9c6" stroke-width="5"/>
<ellipse cx="0" cy="-24" rx="28" ry="22" fill="#c8532d"/><circle cx="0" cy="-58" r="20" fill="#c8532d"/>
<path d="M-18-70 l-6-18 l16 8z M18-70 l6-18 l-16 8z" fill="#c8532d"/>
<ellipse cx="-10" cy="-54" rx="9" ry="8" fill="#f8ece0"/><ellipse cx="10" cy="-54" rx="9" ry="8" fill="#f8ece0"/>
<circle cx="-8" cy="-62" r="2.5" fill="#222"/><circle cx="8" cy="-62" r="2.5" fill="#222"/><ellipse cx="0" cy="-55" rx="4" ry="3" fill="#222"/>
</g></g>
<g id="panda"><g class="bob">
<ellipse cx="-30" cy="-12" rx="18" ry="14" fill="#1d1d1d"/><ellipse cx="30" cy="-12" rx="18" ry="14" fill="#1d1d1d"/>
<ellipse cx="0" cy="-52" rx="50" ry="42" fill="#fafafa"/>
<ellipse cx="-50" cy="-56" rx="13" ry="28" fill="#1d1d1d" transform="rotate(18 -50 -56)"/><ellipse cx="50" cy="-56" rx="13" ry="28" fill="#1d1d1d" transform="rotate(-18 50 -56)"/>
<circle cx="-30" cy="-146" r="13" fill="#1d1d1d"/><circle cx="30" cy="-146" r="13" fill="#1d1d1d"/>
<circle cx="0" cy="-112" r="40" fill="#fafafa"/>
<ellipse cx="-16" cy="-114" rx="9.5" ry="13" fill="#1d1d1d" transform="rotate(22 -16 -114)"/><ellipse cx="16" cy="-114" rx="9.5" ry="13" fill="#1d1d1d" transform="rotate(-22 16 -114)"/>
<g class="eye"><circle cx="-16" cy="-115" r="4" fill="#fff"/><circle cx="16" cy="-115" r="4" fill="#fff"/><circle cx="-15" cy="-115" r="2" fill="#111"/><circle cx="17" cy="-115" r="2" fill="#111"/></g>
<ellipse cx="0" cy="-102" rx="6.5" ry="4.5" fill="#1d1d1d"/><path d="M-7-95 q7 7 14 0" stroke="#1d1d1d" stroke-width="2" fill="none" stroke-linecap="round"/>
</g></g>
<g id="rain"></g>
<g id="ff"></g>
</svg>
<div id="cap" aria-live="polite"></div>
<div id="intro"><h1 id="it">Bao and the Last Green Shoot</h1><p id="ip">A short story about a panda, a mountain, and sharing.</p><button id="go">Play story</button></div>
</div>
<div id="bar">
<button id="pp" class="sec" aria-label="Pause or play">Pause</button>
<button id="nr" class="sec" aria-pressed="false">Narration: off</button>
<div id="segs"></div>
</div>
</main>
<script>
var S=["In a misty valley, a young panda named Bao woke up with a rumbling tummy.","But the bamboo around him had turned pale and dry. There was nothing to eat.","So Bao set off over the mountains to find fresh bamboo.","Far away, he found one green shoot, and a cold, lost red panda. Bao shared it, half and half.","That night, the rain came. By morning the whole valley was green again. The end."];
var D=6500,i=0,t=0,playing=false,narr=false,NS="http://www.w3.org/2000/svg";
function el(n,a,p){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
var bam=document.getElementById("bam");
[[40,230],[95,270],[150,210],[250,180],[520,190],[600,240],[660,280],[715,220],[765,260]].forEach(function(b,j){
 var g=el("g",{transform:"translate("+b[0]+" 392)",opacity:j%3==2?.7:1},bam),s=el("g",{"class":"st"},g);
 el("rect",{x:-7,y:-b[1],width:14,height:b[1],rx:7},s);
 for(var y=40;y<b[1]-20;y+=48)el("rect",{"class":"nd",x:-7,y:-y,width:14,height:3},s)});
var rain=document.getElementById("rain");
for(var r=0;r<45;r++){var x=Math.random()*800;el("line",{x1:x,y1:0,x2:x-6,y2:22,style:"animation-delay:-"+(Math.random()*.7).toFixed(2)+"s"},rain)}
var ff=document.getElementById("ff");
for(var f=0;f<9;f++)el("circle",{cx:60+Math.random()*680,cy:230+Math.random()*130,r:3,style:"animation-delay:-"+(Math.random()*2.4).toFixed(1)+"s"},ff);
var segs=document.getElementById("segs"),fills=[];
S.forEach(function(_,n){var b=document.createElement("button");b.setAttribute("aria-label","Scene "+(n+1));var d=document.createElement("i");b.appendChild(d);b.onclick=function(){go(n)};segs.appendChild(b);fills.push(d)});
var stage=document.getElementById("stage"),cap=document.getElementById("cap"),intro=document.getElementById("intro"),pp=document.getElementById("pp");
function speak(s){if(!narr||!window.speechSynthesis)return;speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(s);u.rate=.9;speechSynthesis.speak(u)}
function paint(){fills.forEach(function(d,n){d.style.width=(n<i?100:n==i?t/D*100:0)+"%"})}
function go(n){i=n;t=0;stage.dataset.s=n;cap.classList.remove("on");void cap.offsetWidth;cap.textContent=S[n];cap.classList.add("on");speak(S[n]);paint();intro.classList.add("hide");playing=true;pp.textContent="Pause"}
document.getElementById("go").onclick=function(){go(0)};
pp.onclick=function(){if(!playing&&i==S.length-1&&t>=D){go(0);return}playing=!playing;pp.textContent=playing?"Pause":"Play";cap.style.animationPlayState=playing?"running":"paused";if(!playing&&window.speechSynthesis)speechSynthesis.cancel();else if(playing)speak(S[i])};
document.getElementById("nr").onclick=function(e){narr=!narr;e.target.textContent="Narration: "+(narr?"on":"off");e.target.setAttribute("aria-pressed",narr);if(narr&&playing)speak(S[i]);else if(window.speechSynthesis)speechSynthesis.cancel()};
setInterval(function(){if(!playing)return;t+=100;if(t>=D){if(i<S.length-1){go(i+1);return}t=D;playing=false;pp.textContent="Replay";document.getElementById("it").textContent="The end";document.getElementById("ip").textContent="Bao is home, and the valley is full again.";document.getElementById("go").textContent="Watch again";intro.classList.remove("hide")}paint()},100);
</script>
</body>
</html>
